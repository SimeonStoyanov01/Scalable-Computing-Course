replicaCount: 1

image:
  # repository: carmenzz/group-3-project-frontend
  repository: makenjoy/frontend
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 80

ingress:
  enabled: false
  host: frontend.example.com
  path: /

envVars:
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka.default.svc.cluster.local:9092
    

resources:
  requests:
    memory: "128Mi"
    cpu: "250m"
  limits:
    memory: "256Mi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
